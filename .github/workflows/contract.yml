name: Contract

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract suite against staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:contract
        env:
          BRUDCAST_CONTRACT_API_KEY: ${{ secrets.BRUDCAST_CONTRACT_API_KEY }}
          BRUDCAST_CONTRACT_BASE_URL: ${{ vars.BRUDCAST_CONTRACT_BASE_URL }}
